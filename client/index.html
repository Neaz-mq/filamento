<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Filamento | Industrial LED Lighting</title>
    <meta
      name="description"
      content="Filamento designs and manufactures industrial LED lighting for warehouses, factories and commercial spaces."
    />

    <!-- favicon set. .ico টা 16/32/48 তিনটা size একসাথে ধরে রাখে,
         পুরনো browser আর bookmark bar দুইটাই এটা পড়তে পারে -->
    <link rel="icon" href="/favicon.ico" sizes="32x32" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- mobile browser এর address bar এর রঙ -->
    <meta name="theme-color" content="#FFFFFF" />

    <!-- link share করলে (WhatsApp, LinkedIn, Facebook) যা দেখাবে.
         og:image এর জন্য পরে 1200x630 একটা banner বানিয়ে
         public/ এ og-image.jpg নামে রাখবেন, তারপর নিচের লাইন দুইটা খুলবেন -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Filamento | Industrial LED Lighting" />
    <meta
      property="og:description"
      content="Industrial LED lighting for warehouses, factories and commercial spaces."
    />
    <!-- <meta property="og:image" content="/og-image.jpg" /> -->
    <!-- <meta name="twitter:card" content="summary_large_image" /> -->

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
